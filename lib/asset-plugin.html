<script type="text/javascript">
(function () {
    if (typeof RED === "undefined") return;

    // ==========================================
    // 1. CORE UTILITIES
    // ==========================================
/**
 * Shared utility functions for Kufayeka Asset Engine editor.
 */

// Generate a random unique identifier with optional prefix
function makeId(prefix) {
    return (prefix || "id") + "_" + Math.random().toString(36).substr(2, 9);
}

// Auto-replace whitespace with underscore for identifiers
function sanitizeIdentifier(str) {
    if (str == null) return "";
    return String(str).replace(/\s+/g, "_");
}

// Computes all available attribute full paths from the staged globalSection and globalHierarchyById
function getAllAttributePaths(globalSection, globalHierarchyById) {
    var paths = [];
    if (globalHierarchyById && Object.keys(globalHierarchyById).length > 0) {
        Object.values(globalHierarchyById).forEach(function (hNode) {
            var prefix = hNode.path || hNode.name;
            (hNode.effectiveAttributes || []).forEach(function (attr) {
                if (attr && attr.name) {
                    paths.push(prefix + "." + attr.name);
                }
            });
        });
    }

    if (globalSection && globalSection.assets) {
        var assetById = {};
        globalSection.assets.forEach(function (a) { assetById[a.id] = a; });
        function getAssetPath(id) {
            var a = assetById[id];
            if (!a) return "";
            if (!a.parentId) return a.name || a.id;
            return getAssetPath(a.parentId) + "." + (a.name || a.id);
        }

        globalSection.assets.forEach(function (a) {
            var aPath = getAssetPath(a.id);
            (a.templateIds || []).forEach(function (tplId) {
                var tpl = (globalSection.attributeTemplates || []).find(function (t) { return t.id === tplId; });
                if (tpl) {
                    (tpl.attributes || []).forEach(function (attr) {
                        if (attr && attr.enabled !== false && attr.name) {
                            paths.push(aPath + "." + attr.name);
                        }
                    });
                }
            });
            Object.keys(a.attributes || {}).forEach(function (attrName) {
                paths.push(aPath + "." + attrName);
            });
        });
    }

    return Array.from(new Set(paths)).filter(Boolean).sort();
}

// Sparkplug DataTypes (see lib/sparkplug/sparkplugCodec.js's DataType enum,
// plus the "JsonString" alias) -> the typedInput "kind" their value should
// be edited as. Shared by both the Attribute Template editor's "Default
// Value" field and the Asset Manager sidebar's live "Value" field, so a
// value's editor always matches what the attribute will actually publish/
// accept as, instead of letting a user pick a mismatched editor type.
var SPARKPLUG_TYPE_INPUT_KIND = {
    Int8: "num", Int16: "num", Int32: "num", Int64: "num",
    UInt8: "num", UInt16: "num", UInt32: "num", UInt64: "num",
    Float: "num", Double: "num", DateTime: "num",
    Boolean: "bool",
    String: "str", Text: "str", UUID: "str",
    // Wire-alias of String (see sparkplugMapping.js's SPARKPLUG_TYPE_ALIASES)
    // — defaults to the "json" editor purely for a nicer authoring
    // experience (the actual value is still published as JSON-source text).
    JsonString: "json",
    // Bytes/File accept a base64 string or plain text — "str" is the
    // simplest editable shape (sparkplugCodec's own toBuffer() handles it).
    Bytes: "str", File: "str",
    DataSet: "json", Template: "json",
    Int8Array: "json", Int16Array: "json", Int32Array: "json", Int64Array: "json",
    UInt8Array: "json", UInt16Array: "json", UInt32Array: "json", UInt64Array: "json",
    FloatArray: "json", DoubleArray: "json", BooleanArray: "json", StringArray: "json", DateTimeArray: "json"
};

// Resolves what typedInput "kind" (num/bool/str/json) an attribute's value
// should be edited as, and whether that choice is locked (the attribute
// opted into a specific Sparkplug DataType, so there's exactly one right
// answer) or just a sensible default (no sparkplugType set — falls back to
// the attribute's own generic valueType, same as this always worked).
function resolveValueInputKind(attr) {
    attr = attr || {};
    if (attr.sparkplugType && SPARKPLUG_TYPE_INPUT_KIND[attr.sparkplugType]) {
        return { kind: SPARKPLUG_TYPE_INPUT_KIND[attr.sparkplugType], locked: true };
    }
    var kind = "str";
    if (attr.valueType === "number") kind = "num";
    else if (attr.valueType === "boolean") kind = "bool";
    else if (attr.valueType === "object" || attr.valueType === "array") kind = "json";
    return { kind: kind, locked: false };
}

window.KufayekaUtils = {
    makeId: makeId,
    sanitizeIdentifier: sanitizeIdentifier,
    getAllAttributePaths: getAllAttributePaths,
    resolveValueInputKind: resolveValueInputKind
};

    // ==========================================
    // 2. SCHEMA STORE & STAGING BRIDGE
    // ==========================================
/**
 * Schema Store & Node-RED Config Node bridge for Kufayeka Asset Engine editor.
 */

(function () {
    var globalSection = null;
    var globalHierarchyById = {};

    function getGlobalSection() {
        return globalSection;
    }

    function setGlobalSection(val) {
        globalSection = val;
    }

    function getGlobalHierarchyById() {
        return globalHierarchyById;
    }

    function setGlobalHierarchyById(val) {
        globalHierarchyById = val || {};
    }

    // Schema (asset hierarchy structure + attribute templates) is staged into a
    // hidden config node and only takes effect on Deploy — exactly like editing
    // any other node's config. Live attribute VALUES are a separate concern and
    // keep going through the instant "api/assets/value/*" endpoint (untouched).
    function getOrCreateAssetSchemaNode() {
        var found = null;
        RED.nodes.eachConfig(function (n) {
            if (!found && n.type === "kufayeka-asset-schema") found = n;
        });
        if (!found) {
            found = {
                id: RED.nodes.id(),
                type: "kufayeka-asset-schema",
                name: "Asset Schema",
                attributeTemplates: [],
                assets: [],
                historians: [],
                users: []
            };
            // RED.nodes.add() needs the type definition attached as _def before it will
            // accept the node (it dereferences _def internally) — mirrors how the editor
            // itself builds a new node from RED.nodes.getType(type) in view.js.
            found._def = RED.nodes.getType("kufayeka-asset-schema");
            RED.nodes.add(found);
        }
        return found;
    }

    function saveSchemaToConfigNode(callback) {
        var schemaNode = getOrCreateAssetSchemaNode();
        var hasSpaces = false;
        var sanitize = (window.KufayekaUtils && window.KufayekaUtils.sanitizeIdentifier) || function (s) { return String(s || "").replace(/\s+/g, "_"); };

        var attributeTemplates = (globalSection.attributeTemplates || []).map(function (t) {
            var tName = String(t.name || "");
            if (/\s/.test(tName)) hasSpaces = true;
            t.name = sanitize(tName);
            if (Array.isArray(t.attributes)) {
                t.attributes = t.attributes.map(function (attr) {
                    var aName = String(attr.name || "");
                    if (/\s/.test(aName)) hasSpaces = true;
                    attr.name = sanitize(aName);
                    return attr;
                });
            }
            return t;
        });

        var assets = (globalSection.assets || []).map(function (a) {
            var aName = String(a.name || "");
            if (/\s/.test(aName)) hasSpaces = true;
            var cleanName = sanitize(aName);
            a.name = cleanName;
            return { id: a.id, name: cleanName, parentId: a.parentId, templateIds: a.templateIds || [] };
        });

        schemaNode.attributeTemplates = attributeTemplates;
        schemaNode.assets = assets;
        schemaNode.historians = (globalSection.historians || []).filter(function (h) { return h.id !== "default"; });
        RED.nodes.dirty(true);

        if (hasSpaces) {
            RED.notify("Warning: Spaces in asset/template/attribute names were automatically replaced with underscores (_).", "warning");
        } else {
            RED.notify("Schema change staged — click Deploy to apply", "success");
        }
        if (callback) callback();
    }

    window.KufayekaSchemaStore = {
        getGlobalSection: getGlobalSection,
        setGlobalSection: setGlobalSection,
        getGlobalHierarchyById: getGlobalHierarchyById,
        setGlobalHierarchyById: setGlobalHierarchyById,
        getOrCreateAssetSchemaNode: getOrCreateAssetSchemaNode,
        saveSchemaToConfigNode: saveSchemaToConfigNode
    };
})();

    // ==========================================
    // 3. REUSABLE UI COMPONENTS
    // ==========================================
/**
 * Reusable Trigger Schedule Picker Form Component.
 * Builds UI for interval, interval-between-times, specific-time, days picker, and delay.
 */

function buildTriggerSchedulePicker(container, node, onChange) {
    var uid = "kufayeka-sched-" + (node.id || Math.random().toString(36).slice(2));

    var rowOnce = $('<div class="form-row"></div>').appendTo(container);
    $('<label>&nbsp;</label>').appendTo(rowOnce);
    var onceCheckbox = $('<input type="checkbox" style="display:inline-block; width:15px; vertical-align:baseline; margin:0 6px 0 0; cursor:pointer;">')
        .prop("checked", node.once === true)
        .appendTo(rowOnce);
    $('<span>Fire once after</span>&nbsp;').appendTo(rowOnce);
    var onceDelayInput = $('<input type="text" placeholder="0.1" style="width:45px; height:28px; display:inline-block; margin:0 4px; text-align:center;">')
        .val(node.onceDelay !== undefined ? node.onceDelay : 0.1)
        .appendTo(rowOnce);
    $('<span>&nbsp;seconds delay (in addition to any schedule below)</span>').appendTo(rowOnce);

    var rowTypeSelect = $('<div class="form-row" style="margin-top:10px;"></div>').appendTo(container);
    $('<label><i class="fa fa-repeat"></i> Schedule</label>').appendTo(rowTypeSelect);
    var typeSelect = $('<select style="width: calc(100% - 110px);"></select>').appendTo(rowTypeSelect);
    [
        { value: "none", label: "none" },
        { value: "interval", label: "interval" },
        { value: "interval-time", label: "interval between times" },
        { value: "time", label: "at a specific time" }
    ].forEach(function (opt) { $("<option>").val(opt.value).text(opt.label).appendTo(typeSelect); });

    var rowInterval = $('<div class="form-row kufayeka-inject-time-row hidden"></div>').appendTo(container);
    $('<span>every </span>').appendTo(rowInterval);
    var intervalCount = $('<input class="kufayeka-inject-time-count" value="1" style="width: 80px; display: inline-block;">').appendTo(rowInterval);
    var intervalUnits = $('<select style="width: 100px; display: inline-block; margin-left: 6px;"></select>').appendTo(rowInterval);
    [["s", "seconds"], ["m", "minutes"], ["h", "hours"]].forEach(function (u) { $("<option>").val(u[0]).text(u[1]).appendTo(intervalUnits); });

    var rowIntervalTime = $('<div class="form-row kufayeka-inject-time-row hidden"></div>').appendTo(container);
    $('<span>every </span>').appendTo(rowIntervalTime);
    var intUnits = $('<select style="width: 90px; margin-left: 8px; margin-right: 6px;" class="inject-time-int-count"></select>').appendTo(rowIntervalTime);
    ["1", "2", "3", "4", "5", "6", "10", "12", "15", "20", "30", "0"].forEach(function (m) {
        $("<option>").val(m).text(m === "0" ? "60" : m).appendTo(intUnits);
    });
    $('<span>minutes</span><br>').appendTo(rowIntervalTime);
    $('<span>between </span>').appendTo(rowIntervalTime);
    var intervalTimeStart = $('<select class="kufayeka-inject-time-times" style="margin-left: 4px; margin-right: 8px;"></select>').appendTo(rowIntervalTime);
    $('<span>and </span>').appendTo(rowIntervalTime);
    var intervalTimeEnd = $('<select class="kufayeka-inject-time-times" style="margin-left: 4px;"></select><br>').appendTo(rowIntervalTime);

    var dayNames = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    function buildDayPicker(parent) {
        var wrap = $('<div class="kufayeka-inject-time-days" style="margin-top: 6px;"></div>').appendTo(parent);
        $('<div style="display:inline-block; vertical-align:top; margin-right:8px;">on</div>').appendTo(wrap);
        var grid = $('<div style="display:inline-block;"></div>').appendTo(wrap);
        var r1 = $('<div></div>').appendTo(grid);
        var r2 = $('<div></div>').appendTo(grid);
        var r3 = $('<div></div>').appendTo(grid);
        [0, 1, 2].forEach(function (i) { $('<label><input type="checkbox" checked value="' + (i + 1) + '"> ' + dayNames[i] + '</label>').appendTo(r1); });
        [3, 4, 5].forEach(function (i) { $('<label><input type="checkbox" checked value="' + (i + 1) + '"> ' + dayNames[i] + '</label>').appendTo(r2); });
        $('<label><input type="checkbox" checked value="0"> ' + dayNames[6] + '</label>').appendTo(r3);
        return wrap;
    }
    var daysIntervalTime = buildDayPicker(rowIntervalTime);

    var rowTime = $('<div class="form-row kufayeka-inject-time-row hidden"></div>').appendTo(container);
    $('<span>at </span>').appendTo(rowTime);
    var timeInput = $('<input type="text" value="12:00" style="width:75px; margin-left:8px; margin-bottom:8px;"><br>').appendTo(rowTime);
    var daysTime = buildDayPicker(rowTime);

    var allRows = rowInterval.add(rowIntervalTime).add(rowTime);
    $([intervalTimeStart[0], intervalTimeEnd[0]]).each(function () {
        for (var i = 0; i < 24; i++) {
            var l = (i < 10 ? "0" : "") + i + ":00";
            $(this).append($("<option></option>").val(i).text(l));
        }
    });
    $("<option></option>").val(24).text("00:00").appendTo(intervalTimeEnd);
    intervalTimeStart.on("change", function () {
        var start = Number(intervalTimeStart.val());
        var end = Number(intervalTimeEnd.val());
        intervalTimeEnd.empty();
        for (var i = start + 1; i < 25; i++) {
            var l = (i < 10 ? "0" : "") + i + ":00";
            if (i === 24) l = "00:00";
            var opt = $("<option></option>").val(i).text(l).appendTo(intervalTimeEnd);
            if (i === end) opt.attr("selected", "selected");
        }
        emitChange();
    });
    container.find(".kufayeka-inject-time-count").spinner({
        min: 1,
        change: function () { emitChange(); },
        stop: function () { emitChange(); },
        spin: function () { setTimeout(emitChange, 10); }
    });

    function showRowFor(type) {
        allRows.hide();
        if (type === "interval") rowInterval.show();
        else if (type === "interval-time") rowIntervalTime.show();
        else if (type === "time") rowTime.show();
    }

    function emitChange() {
        var repeat = "";
        var crontab = "";
        var type = typeSelect.val();
        if (type === "interval") {
            var count = Number(intervalCount.val()) || 1;
            var units = intervalUnits.val();
            repeat = units === "h" ? count * 3600 : (units === "m" ? count * 60 : count);
        } else if (type === "interval-time") {
            var count2 = intUnits.val();
            var startTime = Number(intervalTimeStart.val());
            var endTime = Number(intervalTimeEnd.val());
            var days = rowIntervalTime.find('input[type=checkbox]:checked').map(function (_, el) { return $(el).val(); }).get();
            if (days.length > 0) {
                days = days.length === 7 ? "*" : days.join(",");
                var timerange;
                if (endTime === 0 || endTime === 24) timerange = startTime === 0 ? "0-23" : startTime + "-23";
                else if (startTime + 1 < endTime) timerange = startTime + "-" + (endTime - 1);
                else if (startTime + 1 === endTime) timerange = String(startTime);
                else {
                    var sp = (startTime === 23) ? "23" : startTime + "-23";
                    var ep = (endTime === 1) ? "0" : "0-" + (endTime - 1);
                    timerange = sp + "," + ep;
                }
                crontab = (count2 === "0" ? "0 " : "*/" + count2 + " ") + timerange + " * * " + days;
            }
        } else if (type === "time") {
            var time = timeInput.val() || "12:00";
            var days2 = rowTime.find('input[type=checkbox]:checked').map(function (_, el) { return $(el).val(); }).get();
            if (days2.length > 0) {
                days2 = days2.length === 7 ? "*" : days2.join(",");
                var parts = time.split(":");
                if (parts.length === 2) {
                    var min = ("00" + (parseInt(parts[1], 10) % 60)).substr(-2);
                    var hour = ("00" + (parseInt(parts[0], 10) % 24)).substr(-2);
                    crontab = parseInt(min, 10) + " " + parseInt(hour, 10) + " * * " + days2;
                }
            }
        }

        node.repeat = repeat;
        node.crontab = crontab;
        node.once = onceCheckbox.prop("checked");
        node.onceDelay = Number(onceDelayInput.val()) || 0.1;
        node.dirty = true;
        if (RED.nodes && RED.nodes.dirty) {
            RED.nodes.dirty(true);
        }
        if (onChange) onChange();
    }

    typeSelect.on("change input", function () { showRowFor($(this).val()); emitChange(); });
    [intervalCount, intervalUnits, intUnits, timeInput, onceDelayInput].forEach(function (el) {
        el.on("change keyup input spinstop spinchange", emitChange);
    });
    container.find(".kufayeka-inject-time-days input[type=checkbox]").on("change input", emitChange);
    rowIntervalTime.find("select, input").on("change input", emitChange);
    rowTime.find("select, input").on("change input", emitChange);
    onceCheckbox.on("change input", function () {
        onceDelayInput.prop("disabled", !$(this).prop("checked"));
        emitChange();
    });
    onceDelayInput.prop("disabled", !onceCheckbox.prop("checked"));

    // Parse initial state
    var repeattype = "none";
    if (node.repeat && !node.crontab) {
        repeattype = "interval";
        var r = "s";
        var c = node.repeat || 1;
        if (c % 60 === 0) { r = "m"; c = c / 60; }
        if (c % 60 === 0 && r === "m") { r = "h"; c = c / 60; }
        intervalCount.val(c);
        intervalUnits.val(r);
    } else if (node.crontab) {
        var cronparts = String(node.crontab).trim().split(" ");
        if (cronparts.length >= 5) {
            var cdays = cronparts[4];
            if (!isNaN(cronparts[0]) && !isNaN(cronparts[1])) {
                repeattype = "time";
                var t = (cronparts[1].length === 1 ? "0" + cronparts[1] : cronparts[1]) + ":" + (cronparts[0].length === 1 ? "0" + cronparts[0] : cronparts[0]);
                timeInput.val(t);
                if (cdays === "*" || !cdays) rowTime.find('input[type=checkbox]').prop("checked", true);
                else {
                    rowTime.find('input[type=checkbox]').prop("checked", false);
                    cdays.split(",").forEach(function (v) { rowTime.find('[value=' + v + ']').prop("checked", true); });
                }
            } else {
                repeattype = "interval-time";
                var minutes = cronparts[0].replace("*/", "");
                if (minutes === "") minutes = "0";
                intUnits.val(minutes);
                if (cdays === "*" || !cdays) rowIntervalTime.find('input[type=checkbox]').prop("checked", true);
                else {
                    rowIntervalTime.find('input[type=checkbox]').prop("checked", false);
                    cdays.split(",").forEach(function (v) { rowIntervalTime.find('[value=' + v + ']').prop("checked", true); });
                }
                var timeparts = cronparts[1].split(",");
                var start = "0", end = "24";
                if (timeparts.length === 1) {
                    var hours = timeparts[0].split("-");
                    if (hours.length === 1) {
                        if (hours[0] === "") { start = "0"; end = "0"; } else { start = hours[0]; end = String(Number(hours[0]) + 1); }
                    } else { start = hours[0]; end = String(Number(hours[1]) + 1); }
                } else {
                    var sp2 = timeparts[0].split("-");
                    start = sp2[0];
                    var ep2 = timeparts[1].split("-");
                    end = ep2.length === 1 ? String(Number(ep2[0]) + 1) : String(Number(ep2[1]) + 1);
                }
                intervalTimeStart.val(start).trigger("change");
                intervalTimeEnd.val(end);
            }
        }
    }
    typeSelect.val(repeattype);
    showRowFor(repeattype);
}

window.KufayekaComponents = window.KufayekaComponents || {};
window.KufayekaComponents.buildTriggerSchedulePicker = buildTriggerSchedulePicker;

/**
 * Calculation Script Modal Editor Tray Component.
 * Supports Monaco/Ace editor, fullscreen expansion, trigger modes (onChange, watch, schedule),
 * run policies, and contextual tips.
 */

function openAttributeScriptEditor(attr, onSaved) {
    attr.script = attr.script || { enabled: false, code: "", trigger: { mode: "onChange", scheduleId: "", watch: [] } };
    attr.script.trigger = attr.script.trigger || { mode: "onChange", scheduleId: "", watch: [] };
    if (attr.script.trigger.triggerNodeId && !attr.script.trigger.scheduleId) {
        attr.script.trigger.scheduleId = attr.script.trigger.triggerNodeId;
    }

    var codeEditor;

    RED.tray.show({
        title: "Calculation Script — " + (attr.name || "attribute"),
        width: 750,
        buttons: [
            { id: "kufayeka-script-cancel", text: "Cancel", click: function () { RED.tray.close(); } },
            {
                id: "kufayeka-script-ok",
                text: "Done",
                class: "primary",
                click: function () {
                    var mode = $("#kufayeka-script-trigger-mode").val() || "onChange";
                    var scheduleId = mode === "schedule" ? ($("#kufayeka-script-schedule-select").val() || "") : "";
                    var runPolicy = mode === "schedule" ? ($("#kufayeka-script-run-policy-select").val() || "always") : "always";
                    var watch = mode === "watch"
                        ? ($("#kufayeka-script-watch-list").val() || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean)
                        : [];

                    attr.script = {
                        enabled: $("#kufayeka-script-enabled").prop("checked"),
                        code: codeEditor.getValue(),
                        trigger: {
                            mode: mode,
                            scheduleId: scheduleId,
                            runPolicy: runPolicy,
                            triggerNodeId: scheduleId, // for backwards compatibility
                            watch: watch
                        }
                    };
                    RED.tray.close();
                    if (onSaved) onSaved();
                }
            }
        ],
        resize: function () {
            if (codeEditor) codeEditor.resize();
        },
        open: function (tray) {
            var content = tray.find(".red-ui-tray-body");
            var form = $("<div>").css({ padding: "8px 4px" }).appendTo(content);

            // ==========================================
            // 1. MONACO / ACE CODE EDITOR (Function Node Style)
            // ==========================================
            var editorRow = $('<div class="form-row node-text-editor-row" style="position:relative; margin-bottom: 14px;"></div>').appendTo(form);
            $('<div style="height: 240px; min-height: 160px;" class="node-text-editor" id="kufayeka-script-code-editor"></div>').appendTo(editorRow);

            var expandWrap = $('<div style="position: absolute; right: 0; bottom: calc(100% - 20px); z-index: 10;"></div>').appendTo(editorRow);

                var value = codeEditor.getValue();

                RED.editor.editJavaScript({
                    value: value,
                    width: "Infinity",
                    mode: "ace/mode/nrjavascript",
                    focus: true,
                    cancel: function () {
                        setTimeout(function () { codeEditor.focus(); }, 250);
                    },
                    complete: function (v) {
                        codeEditor.setValue(v, -1);
                        setTimeout(function () {
                            if (codeEditor.restoreView) codeEditor.restoreView();
                            codeEditor.focus();
                        }, 250);
                    }
                });
            });

            // ==========================================
            // 2. ENABLE CALCULATION SCRIPT CHECKBOX
            // ==========================================
            var rowEnabled = $('<div class="form-row" id="kufayeka-script-enabled-row"></div>').appendTo(form);
            $('<label for="kufayeka-script-enabled">&nbsp;</label>').appendTo(rowEnabled);

                .prop("checked", attr.script.enabled === true)
                .appendTo(rowEnabled);

            // ==========================================

            $('<option value="onChange">On Value Change (Instant calculation on write)</option>').appendTo(triggerModeSelect);
            $('<option value="watch">Watch Attributes (Instant recalculation when ANY watched attribute changes)</option>').appendTo(triggerModeSelect);
            $('<option value="schedule">Trigger Schedule (Execute on centralized schedule timer)</option>').appendTo(triggerModeSelect);

            // ==========================================
            // 3b. WATCH LIST (for "watch" trigger mode)
            // ==========================================
            var rowWatchList = $('<div class="form-row" id="kufayeka-script-watch-row" style="display:none; margin-bottom: 10px;"></div>').appendTo(form);
            $('<label for="kufayeka-script-watch-list"><i class="fa fa-eye"></i> Watch</label>').appendTo(rowWatchList);
            var watchListInput = $('<input type="text" id="kufayeka-script-watch-list" style="width: calc(100% - 110px);" placeholder="a, b  (or Plant1.Line1.Motor1.a for a different asset)">').appendTo(rowWatchList);
            RED.popover.tooltip(watchListInput, "Comma-separated attribute names. Bare names (e.g. \"a\") watch a sibling on THIS asset; use a full path for a different asset.");

            // ==========================================
            // 4. CENTRALIZED TRIGGER SCHEDULE SELECTOR
            // ==========================================
            var rowScheduleSelect = $('<div class="form-row" id="kufayeka-script-schedule-row" style="display:none; margin-bottom: 10px;"></div>').appendTo(form);
            $('<label for="kufayeka-script-schedule-select"><i class="fa fa-repeat"></i> Schedule</label>').appendTo(rowScheduleSelect);
            var scheduleSelectWrap = $('<div style="display:inline-block; width: calc(100% - 110px);"></div>').appendTo(rowScheduleSelect);
            var scheduleSelect = $('<select id="kufayeka-script-schedule-select" style="width: calc(100% - 70px); vertical-align: middle;"></select>').appendTo(scheduleSelectWrap);
            var addScheduleBtn = $('<button type="button" class="red-ui-button" style="margin-left: 5px; vertical-align: middle;"><i class="fa fa-plus"></i></button>').appendTo(scheduleSelectWrap);
            RED.popover.tooltip(addScheduleBtn, "Add a new Trigger Schedule config node");

            var rowRunPolicy = $('<div class="form-row" id="kufayeka-script-run-policy-row" style="display:none; margin-bottom: 10px;"></div>').appendTo(form);
            $('<label for="kufayeka-script-run-policy-select"><i class="fa fa-play-circle-o"></i> Execution</label>').appendTo(rowRunPolicy);
            var runPolicySelect = $('<select id="kufayeka-script-run-policy-select" style="width: calc(100% - 110px);"></select>').appendTo(rowRunPolicy);
            $('<option value="always">Always run on schedule (Continuous — fires every tick even without new write)</option>').appendTo(runPolicySelect);
            $('<option value="onlyOnWrite">Only run if new write arrives (Waits for incoming write before executing)</option>').appendTo(runPolicySelect);

            function refreshScheduleOptions(selectedId) {
                scheduleSelect.empty();
                var count = 0;
                var seen = {};
                function addOption(cn) {
                    if (cn && cn.type === "kufayeka-trigger-schedule" && !seen[cn.id]) {
                        seen[cn.id] = true;
                        count++;
                        var label = cn.name || ("Schedule (" + (cn.repeat ? "every " + cn.repeat + "s" : cn.crontab || cn.id) + ")");
                        var opt = $('<option>').val(cn.id).text(label).appendTo(scheduleSelect);
                        if (cn.id === selectedId) opt.prop("selected", true);
                    }
                }
                if (RED.nodes.eachConfig) {
                    RED.nodes.eachConfig(addOption);
                }
                if (RED.nodes.eachNode) {
                    RED.nodes.eachNode(addOption);
                }
                if (RED.nodes.filterNodes) {
                    var filtered = RED.nodes.filterNodes({ type: "kufayeka-trigger-schedule" });
                    if (Array.isArray(filtered)) {
                        filtered.forEach(addOption);
                    }
                }
                if (selectedId && !seen[selectedId] && RED.nodes.node) {
                    var directNode = RED.nodes.node(selectedId);
                    if (directNode && directNode.type === "kufayeka-trigger-schedule") {
                        addOption(directNode);
                    }
                }
                if (count === 0) {
                    $('<option value="">(none yet — click + to add one)</option>').appendTo(scheduleSelect);
                } else if (selectedId) {
                    scheduleSelect.val(selectedId);
                }
            }

            var onNodeAdd = function (node) {
                if (node && node.type === "kufayeka-trigger-schedule") {
                    refreshScheduleOptions(node.id);
                }
            };
            var onNodeChange = function (node) {
                if (node && node.type === "kufayeka-trigger-schedule") {
                    refreshScheduleOptions(scheduleSelect.val());
                }
            };
            if (RED.events && RED.events.on) {
                RED.events.on("nodes:add", onNodeAdd);
                RED.events.on("nodes:change", onNodeChange);
            }

            addScheduleBtn.on("click", function (evt) {
                evt.preventDefault();
                RED.editor.editConfig("", "kufayeka-trigger-schedule", "_ADD_");
            });

            var currentMode = "onChange";
            if (attr.script.trigger) {
                if (["schedule", "sharedTrigger", "interval", "crontab"].indexOf(attr.script.trigger.mode) !== -1) currentMode = "schedule";
                else if (attr.script.trigger.mode === "watch") currentMode = "watch";
            }
            var initialScheduleId = (attr.script.trigger && (attr.script.trigger.scheduleId || attr.script.trigger.triggerNodeId)) || "";
            var initialRunPolicy = (attr.script.trigger && attr.script.trigger.runPolicy) || "always";
            var initialWatchList = (attr.script.trigger && Array.isArray(attr.script.trigger.watch)) ? attr.script.trigger.watch.join(", ") : "";

            triggerModeSelect.val(currentMode);
            runPolicySelect.val(initialRunPolicy);
            watchListInput.val(initialWatchList);
            refreshScheduleOptions(initialScheduleId);

            function updateModeVisibility() {
                var mode = triggerModeSelect.val();
                rowScheduleSelect.toggle(mode === "schedule");
                rowRunPolicy.toggle(mode === "schedule");
                rowWatchList.toggle(mode === "watch");
            }

            triggerModeSelect.on("change", updateModeVisibility);
            updateModeVisibility();

            // ==========================================
            // 5. CHEAT SHEET & TIP CALLOUT
            // ==========================================
            var tipsBox = $('<div style="margin-top: 18px; padding: 10px 14px; border-radius: 4px; border: 1px solid var(--red-ui-secondary-border-color, #e2e8f0); background: var(--red-ui-tertiary-background, #f8fafc); font-size: 11px; line-height: 1.6; color: var(--red-ui-secondary-text-color, #64748b);"></div>').appendTo(form);
            $('<div><strong style="color:var(--red-ui-primary-text-color, #1e293b);"><i class="fa fa-info-circle"></i> Execution Behavior & Context Cheat Sheet:</strong></div>').appendTo(tipsBox);
            $('<div>&bull; <strong>On Value Change</strong>: Calculation executes immediately on incoming writes and returns the final value.</div>').appendTo(tipsBox);
            $('<div>&bull; <strong>Watch Attributes</strong>: Recalculates immediately the instant ANY attribute in the Watch list changes — no direct write to this attribute needed. Use this for derived/formula attributes (e.g. <code>result = a * b</code>) instead of a Trigger Schedule, so the result is never stale between poll ticks.</div>').appendTo(tipsBox);
            $('<div>&bull; <strong>Trigger Schedule</strong>: Incoming writes are staged (as <code>self</code>); the calculation executes and commits when the selected centralized schedule timer fires.</div>').appendTo(tipsBox);
            $('<div>&bull; Script must <code>return</code> the final computed value. Available variables:</div>').appendTo(tipsBox);
            $('<div style="padding-left: 10px;">- <code>self</code>: Current incoming/staged raw value.<br>- <code>current</code>: This attribute\'s existing stored value before this calculation.<br>- <code>prevSelf</code>: Previous <code>self</code> raw value seen by this attribute (useful for delta/counter rate calculations).<br>- <em>Sibling attributes</em>: Direct read & write to other attributes on the same asset (e.g. <code>status = "ALARM";</code> or <code>setSibling("status", "ALARM")</code> or <code>sibling.status = "ALARM"</code>).<br>- <em>Cross-asset paths</em>: Full path read/write starting with <code>%</code> (e.g. <code>%Plant1.Line1.Motor1.power = 100</code>) or <code>asset.set(...)</code>.</div>').appendTo(tipsBox);
        },
        close: function () {
            if (codeEditor) codeEditor.destroy();
            if (RED.events && RED.events.off) {
                RED.events.off("nodes:add", onNodeAdd);
                RED.events.off("nodes:change", onNodeChange);
            }
        }
    });
}

        }).appendTo(tableSection);

        $("<span style='font-size:11px; font-weight:bold; text-transform:uppercase; color:var(--red-ui-secondary-text-color, #666);'>Effective Attributes</span>").appendTo(leftTableToolbar);

        ].forEach(function (col) {

    function updateLiveWatchStatus() {
        if (!liveWatchStatus) return;
        if (!currentAssetId) {
            liveWatchStatus.text("");
            return;
        }
        var watched = watchedAssetIds.has(currentAssetId);
        liveWatchStatus
            .css({ color: watched ? "#065f46" : "#94a3b8" })
            .html('<span class="kufayeka-pulse-dot ' + (watched ? "kufayeka-pulse-live" : "") + '" style="' + (watched ? "" : "background-color:#94a3b8;") + '"></span> Live Watch: ' + (watched ? "ON" : "OFF"));
    }

    function applyLiveChanges(meta) {
        if (!currentAssetId || !watchedAssetIds.has(currentAssetId)) return;
        var changes = (meta && meta.change && meta.change.changes) || [];
        if (!changes.length) return;

        changes.forEach(function (change) {
            if (!change || change.kind !== "attribute" || change.assetId !== currentAssetId) return;

            var row = tableBody.find("tr[data-attr-name='" + change.attributeName + "']");
            if (!row.length) return;

            var activeInput = row.find(":focus");
            if (!activeInput.length) {
                var valInput = row.find(".kufayeka-attr-val-input");
                var currentVal = change.value !== undefined && change.value !== null ? (typeof change.value === "object" ? JSON.stringify(change.value) : String(change.value)) : "";
                if (valInput.length && valInput.typedInput) {
                    valInput.typedInput("value", currentVal);
                }
            }

            var tsCell = row.find(".kufayeka-attr-ts");
            if (tsCell.length) {
                tsCell.text(change.ts ? new Date(change.ts).toLocaleTimeString() : "-");
            }

            row.css("background-color", "rgba(16, 185, 129, 0.14)");
            setTimeout(function () {
                row.css("background-color", "");
            }, 600);
        });
    }

    function load() {
        $.getJSON("api/assets/system", function (resp) {
            getStore().setGlobalSection(resp.data || resp);
            $.getJSON("api/assets/hierarchy?populated=true", function (hResp) {
                var hData = {};
                indexHierarchy(hResp.data || hResp, hData);
                getStore().setGlobalHierarchyById(hData);
                refreshTree();
                if (currentAssetId && findAsset(currentAssetId)) {
                    selectAsset(currentAssetId);
                } else {
                    selectAsset(null);
                }
            });
        }).fail(function () {
            $.getJSON("assets/system", function (resp) {
                getStore().setGlobalSection(resp.data || resp);
                $.getJSON("assets/hierarchy?populated=true", function (hResp) {
                    var hData = {};
                    indexHierarchy(hResp.data || hResp, hData);
                    getStore().setGlobalHierarchyById(hData);
                    refreshTree();
                    if (currentAssetId && findAsset(currentAssetId)) {
                        selectAsset(currentAssetId);
                    } else {
                        selectAsset(null);
                    }
                });
            });
        });
    }

    function indexHierarchy(nodes, targetMap) {
        (nodes || []).forEach(function (node) {
            targetMap[node.id] = node;
            indexHierarchy(node.children, targetMap);
        });
    }

    function findAsset(id) {
        var globalSection = getStore().getGlobalSection();
        if (!globalSection || !globalSection.assets) return null;
        return globalSection.assets.find(function (a) { return a.id === id; });
    }

    function hasChildren(assetId) {
        var globalSection = getStore().getGlobalSection();
        return (globalSection && globalSection.assets ? globalSection.assets : []).some(function (a) { return a.parentId === assetId; });
    }

    function syncExpandedStateFromTree(nodes) {
        (nodes || []).forEach(function (node) {
            if (node.children) {
                if (node.expanded) expandedAssetIds.add(node.assetId);
                else expandedAssetIds.delete(node.assetId);
                syncExpandedStateFromTree(node.children);
            }
        });
    }

    function injectTreeWatchButtons(nodes) {
        (nodes || []).forEach(function (node) {
            if (node.treeList && node.treeList.label) {
                var watched = watchedAssetIds.has(node.assetId);
                var btn = $('<span class="kufayeka-tree-watch-btn"><i class="fa ' + (watched ? "fa-eye" : "fa-eye-slash") + '"></i></span>')
                    .css({
                        float: "right",
                        marginRight: "4px",
                        cursor: "pointer",
                        opacity: watched ? 1 : 0.35,
                        color: watched ? "#059669" : "inherit"
                    })
                    .appendTo(node.treeList.label);
                RED.popover.tooltip(btn, "Toggle live watch for this asset");
                btn.on("click", function (evt) {
                    evt.preventDefault();
                    evt.stopPropagation();
                    var nowWatched = !watchedAssetIds.has(node.assetId);
                    if (nowWatched) watchedAssetIds.add(node.assetId);
                    else watchedAssetIds.delete(node.assetId);
                    btn.find("i").attr("class", "fa " + (nowWatched ? "fa-eye" : "fa-eye-slash"));
                    btn.css({ opacity: nowWatched ? 1 : 0.35, color: nowWatched ? "#059669" : "inherit" });
                    if (node.assetId === currentAssetId) updateLiveWatchStatus();
                });
            }
            if (node.children) injectTreeWatchButtons(node.children);
        });
    }

    function refreshTree() {
        var globalSection = getStore().getGlobalSection();
        if (!globalSection || !globalSection.assets) {
            tree.treeList("data", []);
            lastTreeNodes = [];
            return;
        }
        var byParent = {};
        globalSection.assets.forEach(function (a) {
            var p = a.parentId || "__root__";
            byParent[p] = byParent[p] || [];
            byParent[p].push(a);
        });
        function buildBranch(parentId) {
            return (byParent[parentId] || []).map(function (a) {
                var children = buildBranch(a.id);
                var node = {
                    id: a.id,
                    assetId: a.id,
                    label: a.name || "(unnamed)",
                    icon: "fa fa-cube",
                    selected: a.id === currentAssetId
                };
                if (children.length > 0) {
                    node.children = children;
                    node.expanded = expandedAssetIds.has(a.id);
                }
                return node;
            });
        }
        lastTreeNodes = buildBranch("__root__");
        tree.treeList("data", lastTreeNodes);
        setTimeout(function () { injectTreeWatchButtons(lastTreeNodes); }, 0);
    }

    function selectAsset(assetId) {

    function renderAttributeTable() {
        tableBody.empty();
        if (!currentAssetId) return;

        var globalHierarchyById = getStore().getGlobalHierarchyById();
        var globalSection = getStore().getGlobalSection();
        var hNode = globalHierarchyById[currentAssetId];
        if (!hNode || !hNode.effectiveAttributes || hNode.effectiveAttributes.length === 0) {
            $('<tr><td colspan="7" style="text-align:center; color:var(--red-ui-secondary-text-color, #888); padding:20px;">No effective attributes defined for this asset</td></tr>').appendTo(tableBody);
            return;
        }

        var asset = findAsset(currentAssetId);
        var templateIds = (asset && asset.templateIds) || hNode.templateIds || [];
        var allTemplates = (globalSection && globalSection.attributeTemplates) ? globalSection.attributeTemplates : [];
        var assetPath = hNode.path || hNode.name;

        var groups = {};
        var groupOrder = [];

        hNode.effectiveAttributes.forEach(function (attr) {
            var matchedTpl = null;
            for (var i = 0; i < templateIds.length; i++) {
                var t = allTemplates.find(function (item) { return item.id === templateIds[i]; });
                if (t && t.attributes && t.attributes.some(function (a) { return a.name === attr.name; })) {
                    matchedTpl = t;
                    break;
                }
            }
            if (!matchedTpl) {
                matchedTpl = allTemplates.find(function (t) {
                    return t.attributes && t.attributes.some(function (a) { return a.name === attr.name; });
                });
            }
            var groupName = matchedTpl ? (matchedTpl.name || matchedTpl.id) : "Direct / Custom Attributes";

            if (!groups[groupName]) {
                groups[groupName] = [];
                groupOrder.push(groupName);
            }
            groups[groupName].push(attr);
        });

        groupOrder.sort(function (a, b) {
            if (a === "Direct / Custom Attributes") return 1;
            if (b === "Direct / Custom Attributes") return -1;
            return String(a).localeCompare(String(b), undefined, { sensitivity: "base" });
        });

        groupOrder.forEach(function (gName) {
            groups[gName].sort(function (a, b) {
                return String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" });
            });
        });

        groupOrder.forEach(function (groupName) {
            var attrs = groups[groupName];
            if (!attrs || attrs.length === 0) return;

            var groupHeaderTr = $('<tr class="kufayeka-asset-group-header"></tr>').appendTo(tableBody);
            var groupHeaderTd = $('<td colspan="7"></td>').css({
                "background": "var(--red-ui-tertiary-background, #f1f5f9)",
                "font-weight": "700",
                "font-size": "11px",
                "padding": "7px 12px",
                "color": "var(--red-ui-primary-text-color, #1e293b)",
                "border-top": "1px solid var(--red-ui-secondary-border-color, #e2e8f0)",
                "border-bottom": "1px solid var(--red-ui-secondary-border-color, #e2e8f0)"
            }).appendTo(groupHeaderTr);

            $('<i class="fa fa-cubes" style="margin-right:6px; color:var(--red-ui-text-color-link, #0284c7);"></i>').appendTo(groupHeaderTd);
            $('<span>').text(groupName).appendTo(groupHeaderTd);
            $('<span style="font-weight:normal; font-size:10px; color:var(--red-ui-secondary-text-color, #64748b); margin-left:8px;">(' + attrs.length + ' attribute' + (attrs.length > 1 ? 's' : '') + ')</span>').appendTo(groupHeaderTd);

            attrs.forEach(function (attr) {
                var fullPath = assetPath + "." + attr.name;
                var tr = $("<tr>").attr("data-attr-name", attr.name).appendTo(tableBody);

                // 1. Attribute Name
                $("<td>").css({ "font-weight": "600", "white-space": "nowrap", "padding-left": "20px" }).text(attr.name).appendTo(tr);

                // 2. Description
                $("<td>").css({ "color": "var(--red-ui-secondary-text-color, #64748b)", "font-size": "11px", "white-space": "nowrap" }).text(attr.description || "-").appendTo(tr);

                // 3. Value Editor — ALWAYS locked to the attribute's own
                // type (its opted-in Sparkplug Type if it has one, else its
                // generic valueType): unlike the Attribute Template editor's
                // Default Value (which stays freely-switchable while
                // sparkplugType is "(auto)"), a live value here always has a
                // well-defined type to write as, so there's never a case
                // where switching away from it would make sense.
                var tdVal = $("<td>").css({ "min-width": "190px" }).appendTo(tr);
                var valInput = $('<input type="text" class="kufayeka-attr-val-input" style="width:100%">').appendTo(tdVal);

                var valKind = (window.KufayekaUtils && window.KufayekaUtils.resolveValueInputKind)
                    ? window.KufayekaUtils.resolveValueInputKind(attr)
                    : { kind: "str" };
                var inputType = valKind.kind;

                valInput.typedInput({
                    types: [inputType]
                });

                var initialVal = attr.value !== undefined && attr.value !== null ? (typeof attr.value === "object" ? JSON.stringify(attr.value) : String(attr.value)) : "";
                valInput.typedInput("type", inputType);
                valInput.typedInput("value", initialVal);

                // 4. Action (Apply button)
                var tdAction = $("<td>").css({ "white-space": "nowrap", "text-align": "center" }).appendTo(tr);
                var applyBtn = $('<button class="red-ui-button red-ui-button-small" style="padding:2px 8px;"><i class="fa fa-check"></i> Apply</button>')
                    .appendTo(tdAction)
                    .on("click", function (evt) {
                        evt.preventDefault();
                        var chosenType = valInput.typedInput("type");
                        var raw = valInput.typedInput("value");
                        var parsedVal = raw;

                        if (chosenType === "num") {
                            parsedVal = Number(raw);
                        } else if (chosenType === "bool") {
                            parsedVal = raw === "true" || raw === "1" || raw === true;
                        } else if (chosenType === "json") {
                            try { parsedVal = JSON.parse(raw); } catch (e) { }
                        }

                        function onApplySuccess(resp) {
                            RED.notify("Saved " + attr.name, "success");
                            var match = resp && Array.isArray(resp.matches) && resp.matches[0];
                            if (match) {
                                attr.value = match.value;
                                attr.ts = match.ts;
                                tdTs.text(match.ts ? new Date(match.ts).toLocaleTimeString() : "-");
                            }
                        }

                        $.ajax({
                            url: "api/assets/value/" + encodeURIComponent(fullPath),
                            type: "PUT",
                            contentType: "application/json",
                            data: JSON.stringify({ value: parsedVal }),
                            success: onApplySuccess,
                            error: function () {
                                $.ajax({
                                    url: "assets/value/" + encodeURIComponent(fullPath),
                                    type: "PUT",
                                    contentType: "application/json",
                                    data: JSON.stringify({ value: parsedVal }),
                                    success: onApplySuccess,
                                    error: function () {
                                        RED.notify("Failed to save " + attr.name, "error");
                                    }
                                });
                            }
                        });
                    });
                RED.popover.tooltip(applyBtn, "Apply Value to Runtime");

                // 5. Unit
                $("<td>").css({ "white-space": "nowrap" }).text(attr.unit || "-").appendTo(tr);

                // 6. Updated TS
                var tdTs = $("<td>").addClass("kufayeka-attr-ts").css({ "white-space": "nowrap", "font-size": "11px", "color": "var(--red-ui-secondary-text-color, #64748b)" }).text(attr.ts ? new Date(attr.ts).toLocaleTimeString() : "-").appendTo(tr);

                // 7. Historian
                $("<td>").css({ "white-space": "nowrap" }).text(attr.historianEnabled ? "Yes (" + (attr.historianTargetId || "default") + ")" : "No").appendTo(tr);
            });
        });
    }

    function addAsset(parentId) {
        var makeId = (window.KufayekaUtils && window.KufayekaUtils.makeId) || function (p) { return (p || "id") + "_" + Math.random().toString(36).substr(2, 9); };
        var globalSection = getStore().getGlobalSection();
        var newId = makeId("asset");
        var newName = "Asset_" + ((globalSection.assets || []).length + 1);
        globalSection.assets = globalSection.assets || [];
        globalSection.assets.push({
            id: newId,
            name: newName,
            parentId: parentId,
            templateIds: [],
            attributes: {}
        });
        saveSchema(function () {
            refreshTree();
            selectAsset(newId);
        });
    }

    function removeAsset(assetId) {
        if (!assetId) return;
        if (!confirm("Delete asset and all its children?")) return;

        var globalSection = getStore().getGlobalSection();
        function collectIds(id) {
            var ids = [id];
            (globalSection.assets || []).filter(function (a) { return a.parentId === id; }).forEach(function (child) {
                ids = ids.concat(collectIds(child.id));
            });
            return ids;
        }

        var toRemove = new Set(collectIds(assetId));
        globalSection.assets = (globalSection.assets || []).filter(function (a) { return !toRemove.has(a.id); });
        currentAssetId = null;
        saveSchema(function () {
            refreshTree();
            selectAsset(null);
        });
    }

    function saveSchema(callback) {
        getStore().saveSchemaToConfigNode(callback);
    }

    return { init: init, refresh: load };
})();

            }
        }
        if (RED.nodes.eachConfig) {
            RED.nodes.eachConfig(addIfMatch);
        }
        if (RED.nodes.eachNode) {
            RED.nodes.eachNode(addIfMatch);
        }
        if (RED.nodes.filterNodes) {
            var filtered = RED.nodes.filterNodes({ type: "kufayeka-trigger-schedule" });
            if (Array.isArray(filtered)) {
                filtered.forEach(addIfMatch);
            }
        }
        list.sort(function (a, b) {
            var nameA = (a.name || a.id || "").toLowerCase();
            var nameB = (b.name || b.id || "").toLowerCase();
            return nameA.localeCompare(nameB);
        });
        return list;
    }

    function findSchedule(id) {
        if (!id) return null;
        if (RED.nodes.node) {
            var n = RED.nodes.node(id);
            if (n && n.type === "kufayeka-trigger-schedule") return n;
        }
        var found = null;
        if (RED.nodes.eachConfig) {
            RED.nodes.eachConfig(function (n) { if (n && n.id === id && n.type === "kufayeka-trigger-schedule") found = n; });
        }
        if (!found && RED.nodes.eachNode) {
            RED.nodes.eachNode(function (n) { if (n && n.id === id && n.type === "kufayeka-trigger-schedule") found = n; });
        }
        return found;
    }

    function refreshTreeList() {
        var schedules = listSchedules();
        var data = schedules.map(function (n) {
            var label = n.name || ("Schedule (" + (n.repeat ? "every " + n.repeat + "s" : n.crontab || n.id) + ")");
            return { id: n.id, scheduleId: n.id, label: label, icon: "fa fa-clock-o", selected: n.id === currentScheduleId };
        });
        tree.treeList("data", data);
    }

    function load() {
        refreshTreeList();
        var schedules = listSchedules();
        if (currentScheduleId && findSchedule(currentScheduleId)) {
            selectSchedule(currentScheduleId);
        } else if (schedules.length > 0) {
            selectSchedule(schedules[0].id);
        } else {
            selectSchedule(null);
        }
    }

    function addSchedule() {
        var newNode = {
            id: RED.nodes.id(),
            type: "kufayeka-trigger-schedule",
            name: "Schedule_" + (listSchedules().length + 1),
            repeat: "",
            crontab: "",
            once: false,
            onceDelay: 0.1,
            users: []
        };
        newNode._def = RED.nodes.getType("kufayeka-trigger-schedule");
        RED.nodes.add(newNode);
        RED.nodes.dirty(true);
        refreshTreeList();
        selectSchedule(newNode.id);
    }

    function removeSchedule(id) {
        if (!id) return;
        if (!confirm("Delete this trigger schedule? Any node or attribute script referencing it will stop firing.")) return;
        RED.nodes.remove(id);
        RED.nodes.dirty(true);
        currentScheduleId = null;
        refreshTreeList();
        selectSchedule(null);
    }

    function selectSchedule(id) {
        currentScheduleId = id;
        renderDetail();
        refreshTreeList();
    }

    function renderDetail() {
        detailPane.empty();
        if (!currentScheduleId) {
            $("<div>").css({ padding: "12px", color: "var(--red-ui-secondary-text-color, #888)" }).text("Select a schedule on the left, or click \"Add Schedule\" to create one.").appendTo(detailPane);
            return;
        }
        var node = findSchedule(currentScheduleId);
        if (!node) return;

        var sanitize = (window.KufayekaUtils && window.KufayekaUtils.sanitizeIdentifier) || function (s) { return String(s || "").replace(/\s+/g, "_"); };
        var form = $("<div>").appendTo(detailPane);

        var rowName = $('<div class="form-row" style="margin-bottom:10px"></div>').appendTo(form);
        $("<label style='font-size:11px; font-weight:bold; display:block; margin-bottom:2px;'>Name</label>").appendTo(rowName);
        var nameInput = $('<input type="text" class="red-ui-input" style="width:100%">').val(node.name || "").appendTo(rowName);
        nameInput.on("input", function () {
            var val = $(this).val();
            var sanitized = sanitize(val);
            if (val !== sanitized) {
                var pos = this.selectionStart;
                $(this).val(sanitized);
                if (this.setSelectionRange && pos !== null) {
                    this.setSelectionRange(pos, pos);
                }
            }
            node.name = sanitized;
        });
        nameInput.on("change", function () {
            var sanitized = sanitize($(this).val());
            $(this).val(sanitized);
            node.name = sanitized;
            node.dirty = true;
            if (RED.nodes && RED.nodes.dirty) {
                RED.nodes.dirty(true);
            }
            refreshTreeList();
        });

        var buildPicker = (window.KufayekaComponents && window.KufayekaComponents.buildTriggerSchedulePicker) || buildTriggerSchedulePicker;
        buildPicker(form, node, function () {
            node.dirty = true;
            if (RED.nodes && RED.nodes.dirty) {
                RED.nodes.dirty(true);
            }
            refreshTreeList();
        });

        $('<div style="margin-top:14px; font-size:11px; color:var(--red-ui-secondary-text-color, #888);">Reference this schedule from an attribute\'s Calculation Script ("shared trigger schedule" mode) or from a <b>kufayeka-inject</b> node on the canvas — every consumer of the SAME schedule fires from the identical clock tick.</div>').appendTo(form);
    }

    return { init: init, refresh: load };
})();

window.KufayekaTabs = window.KufayekaTabs || {};
window.KufayekaTabs.TriggerScheduleTab = KufayekaTriggerScheduleTab;

    // ==========================================
    // 5. INTELLISENSE & CODE COMPLETION
    // ==========================================
/**
 * Monaco and Ace IntelliSense & Autocomplete Service.
 * Generates dynamic TypeScript (.d.ts) declarations for `$`, `asset`, `%path` variables,
 * and provides completion item providers for Monaco and Ace editors.
 */

var KufayekaIntellisense = (function () {
    var monacoRegistered = false;
    var monacoExtraLibDisposable = null;
    var aceRegistered = false;

    function getStore() {
        return window.KufayekaSchemaStore;
    }

    function getAttributeItemsDetailed() {
        var items = [];
        var globalHierarchyById = getStore().getGlobalHierarchyById();
        if (globalHierarchyById && Object.keys(globalHierarchyById).length > 0) {
            Object.values(globalHierarchyById).forEach(function (hNode) {
                var prefix = hNode.path || hNode.name;
                (hNode.effectiveAttributes || []).forEach(function (attr) {
                    if (attr && attr.name) {
                        items.push({
                            path: prefix + "." + attr.name,
                            assetPath: prefix,
                            assetName: hNode.name,
                            attrName: attr.name,
                            value: attr.value,
                            valueType: attr.valueType || "custom",
                            unit: attr.unit || "",
                            description: attr.description || "",
                            ts: attr.ts
                        });
                    }
                });
            });
        }
        return items;
    }

    function updateMonacoAssetTypes() {
        if (!window.monaco || !window.monaco.languages || !window.monaco.languages.typescript) return;
        try {
            var items = getAttributeItemsDetailed();
            var rootTree = {};
            items.forEach(function (item) {
                var parts = item.path.split(".").filter(Boolean);
                var curr = rootTree;
                for (var i = 0; i < parts.length - 1; i++) {
                    var p = parts[i];
                    if (!curr[p]) curr[p] = { _children: {} };
                    curr = curr[p]._children;
                }
                var last = parts[parts.length - 1];
                curr[last] = { _isAttr: true, item: item };
            });

            function renderDts(tree, indent) {
                indent = indent || "  ";
                var lines = [];
                for (var k in tree) {
                    var node = tree[k];
                    if (node._isAttr) {
                        var it = node.item;
                        var jsType = it.valueType === "number" ? "number" : it.valueType === "boolean" ? "boolean" : it.valueType === "json" ? "any" : "string";
                        var doc = "/** " + (it.description ? it.description + " | " : "") + "Type: " + it.valueType + (it.unit ? " (" + it.unit + ")" : "") + " | Current: " + JSON.stringify(it.value) + " */";
                        lines.push(indent + doc);
                        lines.push(indent + '"' + k + '": ' + jsType + ';');
                    } else if (node._children) {
                        lines.push(indent + '"' + k + '": {');
                        lines.push(renderDts(node._children, indent + "  "));
                        lines.push(indent + '};');
                    }
                }
                return lines.join("\n");
            }

            var dts = "interface KufayekaAssetTree {\n" + renderDts(rootTree, "  ") + "\n  [key: string]: any;\n}\n" +
                "declare const $: KufayekaAssetTree & { (path: string, val?: any): any; [key: string]: any; };\n" +
                "declare const asset: { get(path: string, fallback?: any): any; set(path: string, val: any): void; query(p: string): any[]; find(p: string, v: any): any; hierarchy(opt?: any): any; };\n";

            for (var rootKey in rootTree) {
                dts += 'declare const ' + rootKey + ': KufayekaAssetTree["' + rootKey + '"] & { [key: string]: any };\n';
                dts += 'declare const $' + rootKey + ': KufayekaAssetTree["' + rootKey + '"] & { [key: string]: any };\n';
            }

            if (monacoExtraLibDisposable && monacoExtraLibDisposable.dispose) {
                monacoExtraLibDisposable.dispose();
            }
            monacoExtraLibDisposable = monaco.languages.typescript.javascriptDefaults.addExtraLib(dts, 'ts:kufayeka-asset-engine.d.ts');

            // Ensure Monaco TypeScript linter does not flag undeclared root variables or % operator
            try {
                var curDiag = monaco.languages.typescript.javascriptDefaults.getDiagnosticsOptions() || {};
                var ignoredCodes = (curDiag.diagnosticCodesToIgnore || []).slice();
                [2304, 2552, 1005, 1109].forEach(function (code) {
                    if (ignoredCodes.indexOf(code) === -1) ignoredCodes.push(code);
                });
                monaco.languages.typescript.javascriptDefaults.setDiagnosticsOptions(Object.assign({}, curDiag, {
                    diagnosticCodesToIgnore: ignoredCodes
                }));
            } catch (diagErr) { }
        } catch (e) {
            // ignore
        }
    }

    function registerMonacoCompleters() {
        if (monacoRegistered || !window.monaco || !window.monaco.languages) return;
        monacoRegistered = true;

        var provider = {
            triggerCharacters: ['%', '$', '.'],
            provideCompletionItems: function (model, position) {
                var textUntilPosition = model.getValueInRange({
                    startLineNumber: position.lineNumber,
                    startColumn: 1,
                    endLineNumber: position.lineNumber,
                    endColumn: position.column
                });
                var word = model.getWordUntilPosition(position);
                var range = {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: word.startColumn,
                    endColumn: word.endColumn
                };

                var items = getAttributeItemsDetailed();
                var suggestions = [];

                items.forEach(function (item) {
                    var displayVal = item.value !== undefined ? String(item.value) : "undefined";
                    var docMarkdown = "**Asset Path:** `" + item.path + "`\n\n" +
                        "**Current Value:** `" + displayVal + (item.unit ? " " + item.unit : "") + "`\n\n" +
                        "**Type:** `" + item.valueType + "`\n\n" +
                        (item.description ? "**Description:** " + item.description + "\n\n" : "") +
                        (item.ts ? "*Timestamp: " + item.ts + "*" : "");

                    // 1. %Path (Primary Asset Tag Identifier)
                    suggestions.push({
                        label: "%" + item.path,
                        kind: monaco.languages.CompletionItemKind.Field,
                        detail: "[" + (item.unit || item.valueType) + "] Live: " + displayVal,
                        documentation: { value: docMarkdown },
                        insertText: "%" + item.path,
                        range: range,
                        sortText: "0_" + item.path
                    });

                    // 2. Direct Path
                    suggestions.push({
                        label: item.path,
                        kind: monaco.languages.CompletionItemKind.Property,
                        detail: "[" + item.valueType + "] Live: " + displayVal,
                        documentation: { value: docMarkdown },
                        insertText: item.path,
                        range: range,
                        sortText: "1_" + item.path
                    });
                });

                return { suggestions: suggestions };
            }
        };

        monaco.languages.registerCompletionItemProvider('javascript', provider);
        try {
            if (monaco.languages.getLanguages().some(function (l) { return l.id === 'typescript'; })) {
                monaco.languages.registerCompletionItemProvider('typescript', provider);
            }
        } catch (e) { }
    }

    function registerAceCompleters() {
        if (aceRegistered || !window.ace) return;
        try {
            var langTools = ace.require("ace/ext/language_tools");
            if (langTools && langTools.addCompleter) {
                aceRegistered = true;
                langTools.addCompleter({
                    identifierRegexps: [/[a-zA-Z_0-9\$\%]/],
                    getCompletions: function (editor, session, pos, prefix, callback) {
                        var items = getAttributeItemsDetailed();
                        var completions = [];
                        items.forEach(function (item) {
                            var displayVal = item.value !== undefined ? String(item.value) : "";
                            completions.push({
                                name: "%" + item.path,
                                value: "%" + item.path,
                                caption: "%" + item.path,
                                meta: "[" + (item.unit || item.valueType) + "] " + displayVal,
                                score: 1000
                            });
                            completions.push({
                                name: item.path,
                                value: item.path,
                                caption: item.path,
                                meta: "[" + (item.unit || item.valueType) + "] " + displayVal,
                                score: 900
                            });
                        });
                        callback(null, completions);
                    }
                });
            }
        } catch (e) {
            // ignore
        }
    }

    function tryInitCodeCompleters() {
        registerMonacoCompleters();
        registerAceCompleters();
        updateMonacoAssetTypes();
    }

    function init() {
        tryInitCodeCompleters();
        setInterval(tryInitCodeCompleters, 2000);
    }

    return {
        init: init,
        updateMonacoAssetTypes: updateMonacoAssetTypes,
        tryInitCodeCompleters: tryInitCodeCompleters,
        getAttributeItemsDetailed: getAttributeItemsDetailed
    };
})();

window.KufayekaIntellisense = KufayekaIntellisense;

    // ==========================================
    // 6. EDITOR PLUGIN REGISTRATION
    // ==========================================
/**
 * Kufayeka Asset Engine - Editor Plugin Entrypoint.
 * Initializes the Sidebar tabs (Asset Manager, Asset Templates, Trigger Schedules),
 * sets up IntelliSense / Code Completion, and registers with RED.plugins.
 */

(function () {
    if (typeof RED === "undefined") return;

    RED.plugins.registerPlugin("kufayeka-asset-engine", {
        type: "node-red-editor-plugin",
        onadd: function () {
            if (window.KufayekaTabs) {
                if (window.KufayekaTabs.AssetManagerTab) window.KufayekaTabs.AssetManagerTab.init();
                if (window.KufayekaTabs.AssetTemplateTab) window.KufayekaTabs.AssetTemplateTab.init();
                if (window.KufayekaTabs.TriggerScheduleTab) window.KufayekaTabs.TriggerScheduleTab.init();
            }
            if (window.KufayekaIntellisense) {
                window.KufayekaIntellisense.init();
            }

            if (RED.comms && RED.comms.subscribe) {
                RED.comms.subscribe("assets/changed", function (topic, data) {
                    if (window.KufayekaIntellisense) {
                        window.KufayekaIntellisense.updateMonacoAssetTypes();
                    }
                });
            }
        }
    });
})();

})();
</script>
